# tmux base config. Layout/sessions live in tmux/sessions/*.sh.

# Snappier escape so vim/nvim inside tmux do not lag on Esc.
set -sg escape-time 10

# Mouse: click panes/tabs, drag borders to resize, scroll history.
set -g mouse on

# 1-based windows/panes read more naturally than 0-based.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000

# Keep the window names the session script sets - the shell must not rename them.
set -g allow-rename off
setw -g automatic-rename off

# Truecolor passthrough for Ghostty (TERM=xterm-ghostty).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"
