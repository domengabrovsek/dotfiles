onboarding = false

[ui]
agent_panel_sort = "spaces"
sidebar_width = 46
sidebar_max_width = 60

status_indicators = "dots"

# Agent rows read $repo, $branch, and $wt from agent-config's hooks/herdr-pane-context.sh.
# $focus comes from agent-config's session-focus mod: a Haiku label for the session.
# The leading dot is state_icon, colored by agent state.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "$repo", fg = "#f8f8f2", bold = true },
  ],
  ["state_text", { token = "$wt", fg = "#ffb86c" }, { token = "$branch", fg = "#8be9fd" }],
  [{ token = "$focus", fg = "#f1fa8c" }],
]

[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "herdr"
